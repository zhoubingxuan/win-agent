name: CI

# Everything here runs without a model, without LM Studio/Ollama and without network
# access: the suites use mock endpoints, and the Windows checks use the machine the
# job runs on. `npm run release` is what publishes a version, so CI never tags.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows-latest · node ${{ matrix.node }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.x is the documented minimum (package.json engines: >=20.3),
        # 22.x is the current LTS line.
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      # test       - context planner
      # providers  - endpoint compatibility against a mock server
      # mcp        - MCP client (stdio + Streamable HTTP) against a mock server
      # models     - LM Studio / Ollama discovery + merging against mock servers
      # mode       - agent modes, JSON repair, text encodings, CLIXML
      # sandbox    - the folder fence and the command fence (paths, junctions, scripts)
      # i18n       - both dictionaries, the HTML attributes and the help text
      # api        - the real server on a temp data folder + a mock model
      # audit      - the audit log and undo, against a temp folder (live registry on Windows)
      # windows    - the live Windows checks (services, registry, encodings, timeouts)
      # isolation  - two copies never share data or a version number
      #
      # scripts/test-all.mjs runs them in order and echoes a failing check as a GitHub
      # annotation, so a red run names the check that broke without reading the log.
      - name: the whole suite
        run: npm run test:all

  docs:
    name: docs and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci

      # The platform-independent suites, on a non-Windows host: they must not depend
      # on Windows (and test:windows has to skip cleanly there).
      - name: platform-independent suites
        run: npm run typecheck

      - name: suites that must pass anywhere
        run: npm test && npm run test:providers && npm run test:mcp && npm run test:models && npm run test:mode && npm run test:i18n && npm run test:audit

      - name: the Windows checks skip cleanly off Windows
        run: npm run test:windows

      # Every documented link, file and settings key has to exist: the README is the
      # manual, and a broken link or an example that names a setting that was removed
      # is a bug users hit before we do.
      - name: docs are consistent with the code
        run: npm run test:docs
